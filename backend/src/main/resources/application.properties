spring.application.name=coffee-compass-backend
server.port=8080

spring.datasource.url=jdbc:h2:file:/opt/coffee-compass/data/coffeecompass;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000 
# 1 hour in milliseconds

# Uncomment to expose exception reason messages (e.g. "Username already taken") in error responses
# server.error.include-message=always

app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:8081,https://coffee-compass.net,https://surprise.coffee-compass.net

app.external.loffee-base-url=https://beta.loffeelabs.com/api/v2
app.external.loffee-api-key=${LOFFEE_API_KEY}

