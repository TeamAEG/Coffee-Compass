<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Compass — Entdecke Kaffee</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2014%2018'%3E%3Cellipse%20cx='7'%20cy='9'%20rx='6'%20ry='7.5'%20fill='%238B5E3C'/%3E%3Cpath%20d='M7%201.8%20Q7.8%205%207%209%20Q6.2%2013%207%2016.2'%20fill='none'%20stroke='%23fff'%20stroke-width='1.3'%20stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="app-header">
        <a href="index.html" class="brand">
            <div class="brand-icon">☕</div>
            <span>Coffee Compass</span>
        </a>
        <nav class="nav">
            <a href="index.html" class="active">Entdecken</a>
            <a href="favorites.html">Favoriten</a>
            <a href="quiz.html">Find Your Perfect Coffee</a>
        </nav>
        <div class="user-info">
            <span id="usernameLabel"></span>
            <button class="secondary" id="logoutBtn" style="padding: 0.45rem 0.9rem; font-size: 0.85rem;">Login</button>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Finde deinen idealen Kaffee</h1>
            <p>Durchsuche kuratierte Kaffees aus der ganzen Welt — gefiltert nach Röstung, Herkunft und Geschmack.</p>
        </section>

        <section class="filter-bar" aria-label="Filter">
            <div class="filter-row filter-row-primary">
                <div class="filter-search-wrap">
                    <label for="search">Suche</label>
                    <input type="text" id="search" placeholder="Name, Rösterei oder Note..." autocomplete="off">
                    <ul id="searchSuggestions" class="autocomplete-list" hidden></ul>
                </div>
                <div class="filter-field">
                    <label>Röstung</label>
                    <div class="multi-select" id="roastMultiSelect">
                        <button class="multi-select-btn" type="button">
                            <span class="ms-label">Alle</span>
                            <span class="ms-caret">▾</span>
                        </button>
                    </div>
                </div>
                <div class="filter-field">
                    <label>Herkunft</label>
                    <div class="multi-select" id="originMultiSelect">
                        <button class="multi-select-btn" type="button">
                            <span class="ms-label">Alle</span>
                            <span class="ms-caret">▾</span>
                        </button>
                    </div>
                </div>
                <div class="filter-reset-wrap">
                    <button id="moreFiltersBtn" class="secondary filter-more-btn">Mehr ▾</button>
                    <button id="resetBtn" class="secondary">Zurücksetzen</button>
                </div>
            </div>
            <div id="filterSecondary" class="filter-secondary-wrap" hidden>
                <div class="filter-row">
                    <div class="filter-field">
                        <label>Typ</label>
                        <div class="multi-select" id="typeMultiSelect">
                            <button class="multi-select-btn" type="button">
                                <span class="ms-label">Alle</span>
                                <span class="ms-caret">▾</span>
                            </button>
                        </div>
                    </div>
                    <div class="filter-field">
                        <label>Prozess</label>
                        <div class="multi-select" id="processMultiSelect">
                            <button class="multi-select-btn" type="button">
                                <span class="ms-label">Alle</span>
                                <span class="ms-caret">▾</span>
                            </button>
                        </div>
                    </div>
                    <div class="filter-price-wrap">
                        <label>Preis bis <span id="priceLabel">Alle</span></label>
                        <div class="filter-price-slider-row">
                            <input type="range" id="priceFilter" min="0" max="100" step="1">
                            <button class="map-open-btn" id="worldMapBtn" type="button" title="Herkunft auf Weltkarte anzeigen">
                                <svg viewBox="0 0 20 20" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <circle cx="10" cy="10" r="8"/>
                                    <path d="M10 2c-2.5 3-3.5 5.5-3.5 8s1 5 3.5 8"/>
                                    <path d="M10 2c2.5 3 3.5 5.5 3.5 8s-1 5-3.5 8"/>
                                    <line x1="2" y1="10" x2="18" y2="10"/>
                                    <line x1="3" y1="6.5" x2="17" y2="6.5"/>
                                    <line x1="3" y1="13.5" x2="17" y2="13.5"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="filter-notes-section">
                    <label>Tasting Notes</label>
                    <div id="notesChips" class="notes-chips"></div>
                </div>
            </div>
        </section>

        <div id="messageBox"></div>

        <div id="coffeeList" class="coffee-grid" aria-live="polite">
            <div class="loading-overlay">
                <div class="spinner"></div>
                <p style="margin-top: 0.6rem;">Lade Kaffees...</p>
            </div>
        </div>
    </main>

    <div id="modalContainer"></div>

    <div id="compareBar" class="compare-bar">
        <div id="compareChips" class="compare-bar-chips"></div>
        <button id="compareNowBtn" class="compare-now-btn">Jetzt vergleichen (0)</button>
        <button id="clearCompareBtn" class="compare-clear-btn">✕ Leeren</button>
    </div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
