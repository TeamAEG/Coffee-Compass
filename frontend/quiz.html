<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Compass — Find Your Perfect Coffee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .quiz-card {
            max-width: 640px;
            margin: 2rem auto;
            background: var(--coffee-paper);
            border: 1px solid var(--coffee-border);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
        }
        .quiz-progress {
            height: 4px;
            background: var(--coffee-foam);
            border-radius: 100px;
            margin-bottom: 2rem;
            overflow: hidden;
        }
        .quiz-progress-bar {
            height: 100%;
            background: var(--coffee-medium);
            transition: width 0.3s ease;
        }
        .quiz-question {
            font-family: var(--font-display);
            font-size: 1.5rem;
            color: var(--coffee-bean);
            margin-bottom: 1.5rem;
            line-height: 1.3;
        }
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            margin-bottom: 2rem;
        }
        .quiz-option {
            padding: 1rem 1.2rem;
            background: var(--coffee-bg);
            border: 2px solid transparent;
            border-radius: var(--radius-md);
            cursor: pointer;
            text-align: left;
            font-size: 1rem;
            color: var(--coffee-text);
            transition: all 0.15s ease;
        }
        .quiz-option:hover {
            border-color: var(--coffee-cream);
            background: var(--coffee-foam);
        }
        .quiz-option.selected {
            border-color: var(--coffee-medium);
            background: var(--coffee-foam);
        }
        .quiz-nav {
            display: flex;
            justify-content: space-between;
            gap: 0.7rem;
        }
        .match-score {
            display: inline-block;
            background: var(--coffee-success);
            color: white;
            padding: 0.2rem 0.7rem;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <div class="brand-icon">☕</div>
            <span>Coffee Compass</span>
        </div>
        <nav class="nav">
            <a href="index.html">Entdecken</a>
            <a href="favorites.html">Favoriten</a>
            <a href="quiz.html" class="active">Find Your Perfect Coffee</a>
        </nav>
        <div class="user-info">
            <span id="usernameLabel"></span>
            <button class="secondary" id="logoutBtn" style="padding: 0.45rem 0.9rem; font-size: 0.85rem;">Login</button>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Find Your Perfect Coffee</h1>
            <p>Beantworte ein paar Fragen — wir finden den passenden Kaffee für dich.</p>
        </section>

        <div id="quizArea"></div>
    </main>

    <div id="modalContainer"></div>

    <script src="js/api.js"></script>
    <script src="js/quiz.js"></script>
</body>
</html>
